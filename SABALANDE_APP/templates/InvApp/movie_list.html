<!DOCTYPE html>
<html>
<head>
    <title>Movie List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Movie List</h1>

    <a href="#" class="button">+ Add Movie</a>

    <table>
        <tr>
            <th>Movie Title</th>
            <th>Genre</th>
            <th>Year</th>
        </tr>

        <tr>
            <td>Avengers: Endgame</td>
            <td>Action</td>
            <td>2019</td>
        </tr>

        <tr>
            <td>Spider-Man</td>
            <td>Action</td>
            <td>2021</td>
        </tr>

        <tr>
            <td>The Batman</td>
            <td>Crime</td>
            <td>2022</td>
        </tr>

        <tr>
            <td>Black Panther</td>
            <td>Action</td>
            <td>2018</td>
        </tr>

    </table>

</div>

</body>
</html>
